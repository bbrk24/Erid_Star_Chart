<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <title>Erid Star Charts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A map of the stars as viewed from the 40 Eridani system." />
    <style>
      body {
        --deg: max(13px, min(calc((100vw - 2em - 4px) / 85), calc((100vh - 1em - 4px) / 54)));
        --star-color: white;
        --space-color: black;
        background-color: dimgray;
        margin: 0.5em;
        width: calc(100vw - 1em);
      }

      body:has(#light-mode:checked) {
        --star-color: black;
        --space-color: white;
        background-color: lightgray;
      }

      h2 {
        margin-bottom: 0;
      }

      #hemispheres {
        display: flex;
        flex-wrap: wrap;
      }

      .star {
        width: 0;
        height: 0;
        position: relative;
        overflow: visible;
      }

      .star::after {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background-color: var(--star-color);
        display: block;
        content: '';
        top: -1.5px;
        left: -1.5px;
        position: relative;
      }

      .region {
        border: 2px solid var(--star-color);
        background-color: var(--space-color);
        display: block;
      }

      .scroll-container {
        width: 100%;
        padding: 0 0.5em;
        margin: 0.5em 0;
        box-sizing: border-box;
        overflow-x: scroll;
      }

      .hemisphere {
        --diameter: min(
          calc(min(100vh, calc(100vw - 1em)) - 1em - 4px),
          calc(max(50vw, 50vh) - 1.5em - 4px)
        );
        width: var(--diameter);
        height: var(--diameter);
        border-radius: 50%;
        margin: 0.5em;
      }

      summary,
      input[type=checkbox] {
        cursor: pointer;
      }

      label {
        cursor: text;
      }

      details {
        margin: 1em 0;
      }

      ol {
        margin: 0;
      }

      #legend tbody {
        color: var(--star-color);
        padding: 0.5em;
        margin-left: 0;
        margin-right: 0;
      }

      #legend .star {
        left: 50%;
      }

      #legend td {
        width: 1em;
        text-align: center;
      }

      #legend tr:first-child td {
        height: 1em;
      }
    </style>
  </head>
  <body>
    <h1>Erid Star Charts</h1>
    <input type="checkbox" id="light-mode" />
    <label for="light-mode">Light mode</label>
    <details>
      <summary>Table of Contents</summary>
      <ol>
        <li><a href="#north-south-hemispheres">North &amp; South Hemispheres</a></li>
        {{Contents}}
      </ol>
    </details>
    <table id="legend">
      <caption>Star magnitude key</caption>
      <tbody class="region">
        {{Legend}}
      </tbody>
    </table>
    <p>Mouse over any star to see its name.</p>
    <section id="north-south-hemispheres">
      <h2>North &amp; South Hemispheres</h2>
      <div id="hemispheres">
        <div class="region hemisphere">
          {{NorthHemisphere}}
        </div>
        <div class="region hemisphere">
          {{SouthHemisphere}}
        </div>
      </div>
    </section>
    {{Constellations}}
  </body>
</html>
