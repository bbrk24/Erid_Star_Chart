<!DOCTYPE html>
<html>
  <head>
    <title>Erid Star Chart</title>
    <style>
      body {
        background-color: dimgray;
        display: flex;
        flex-wrap: wrap;
      }

      .star {
        width: 0;
        height: 0;
        position: relative;
        overflow: visible;
      }

      .star::after {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background-color: white;
        display: block;
        content: '';
        top: -1.5px;
        left: -1.5px;
        position: relative;
      }

      .hemisphere {
        width: calc(max(50vw, 50vh) - 2em);
        height: calc(max(50vw, 50vh) - 2em);
        border: 2px solid white;
        border-radius: 50%;
        background-color: black;
        margin: 0.5em;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="hemisphere" id="north-hemisphere">
      {{NorthHemisphere}}
    </div>
    <div class="hemisphere" id="south-hemisphere">
      {{SouthHemisphere}}
    </div>
  </body>
</html>
