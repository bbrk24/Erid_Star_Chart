<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Erid Star Chart</title>
    <style>
      body {
        background-color: dimgray;
      }

      #hemispheres {
        display: flex;
        flex-wrap: wrap;
      }

      .star {
        width: 0;
        height: 0;
        position: relative;
        overflow: visible;
      }

      .star::after {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background-color: white;
        display: block;
        content: '';
        top: -1.5px;
        left: -1.5px;
        position: relative;
      }

      .region {
        border: 2px solid white;
        background-color: black;
        margin: 0.5em;
        display: block;
      }

      .hemisphere {
        width: calc(max(50vw, 50vh) - 2em);
        height: calc(max(50vw, 50vh) - 2em);
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <h1>Erid Star Chart</h1>
    <section>
      <h2>North & South Hemispheres</h2>
      <div id="hemispheres">
        <div class="region hemisphere">
          {{NorthHemisphere}}
        </div>
        <div class="region hemisphere">
          {{SouthHemisphere}}
        </div>
      </div>
    </section>
    <section>
      <h2>Orion</h2>
      <div class="region" style="width: 26em; height: 31em;">
        {{Orion}}
      </div>
    </section>
  </body>
</html>
