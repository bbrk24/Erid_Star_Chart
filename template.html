<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Erid Star Charts</title>
    <style>
      :root {
        --deg: min(calc((100vw - 2em - 4px) / 50), calc((100vh - 1em - 4px) / 54));
      }

      body {
        background-color: dimgray;
        margin: 0.5em;
      }

      h2 {
        margin-bottom: 0;
      }

      #hemispheres {
        display: flex;
        flex-wrap: wrap;
      }

      .star {
        width: 0;
        height: 0;
        position: relative;
        overflow: visible;
      }

      .star::after {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background-color: white;
        display: block;
        content: '';
        top: -1.5px;
        left: -1.5px;
        position: relative;
      }

      .region {
        border: 2px solid white;
        background-color: black;
        margin: 0.5em;
        display: block;
      }

      .hemisphere {
        --diameter: min(calc(min(100vh, calc(100vw - 1em)) - 1em - 4px), calc(max(50vw, 50vh) - 1.5em - 4px));
        width: var(--diameter);
        height: var(--diameter);
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <h1>Erid Star Charts</h1>
    <details>
      <summary>Table of Contents</summary>
      <ol>
        <li><a href="#north-south-hemispheres">North &amp; South Hemispheres</a></li>
        {{Contents}}
      </ol>
    </details>
    <p>Mouse over any star to see its name.</p>
    <section id="north-south-hemispheres">
      <h2>North &amp; South Hemispheres</h2>
      <div id="hemispheres">
        <div class="region hemisphere">
          {{NorthHemisphere}}
        </div>
        <div class="region hemisphere">
          {{SouthHemisphere}}
        </div>
      </div>
    </section>
    {{Constellations}}
  </body>
</html>
